default:
  depth: 2
  paths:
    "_extensions": "the extension itself, as `quarto add` installs it"
    "_extensions/hebstr-doc": "formats, filters, SCSS themes, bundled fonts and the R syntax definition"
    "scripts": "R scripts the example injects with the `script` shortcode"
    "example.qmd": "feature showcase, rendered to example.html"
    "README.md": "installation, shortcodes and customization"
    "CHANGELOG.md": "release notes"
    "LICENSE.md": "MIT, plus the licences of the bundled third-party assets"
    "package.json": "pinned versions of the stylesheet linter and formatter"
    "stylelint.config.mjs": "stylesheet lint rules"
  highlight:
    - "^README%.md$"
  exclude:
    - "^[^/]*%.html$"
    - "_files$"
    - "node_modules"
    - "^TODO%.md$"
