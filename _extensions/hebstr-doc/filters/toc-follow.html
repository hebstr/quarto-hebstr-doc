<script>
  (function () {
    var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    var nativeOffsetTop = Object.getOwnPropertyDescriptor(
      HTMLElement.prototype,
      "offsetTop",
    ).get;
    var nativeOffsetHeight = Object.getOwnPropertyDescriptor(
      HTMLElement.prototype,
      "offsetHeight",
    ).get;

    function pageZoom() {
      return parseFloat(getComputedStyle(document.documentElement).zoom) || 1;
    }

    function alignScrollSpy() {
      var toc = document.querySelector('nav.toc-active[role="doc-toc"]');
      if (!toc) return;
      toc.querySelectorAll("a[data-scroll-target]").forEach(function (link) {
        var target = link.getAttribute("data-scroll-target");
        var section = target.startsWith("#")
          ? document.getElementById(decodeURI(target.slice(1)))
          : document.querySelector(decodeURI(target));
        if (!section) return;
        Object.defineProperty(section, "offsetTop", {
          configurable: true,
          get: function () {
            return pageZoom() === 1
              ? nativeOffsetTop.call(section)
              : section.getBoundingClientRect().top + window.pageYOffset;
          },
        });
      });
      Object.defineProperty(document.body, "offsetHeight", {
        get: function () {
          var zoom = pageZoom();
          var height = nativeOffsetHeight.call(document.body);
          return zoom === 1 ? height : (height - 1) * zoom;
        },
      });
    }

    alignScrollSpy();

    function follow(behavior) {
      var panel = document.getElementById("quarto-margin-sidebar");
      if (!panel || panel.scrollHeight <= panel.clientHeight) return;
      var links = panel.querySelectorAll('nav[role="doc-toc"] a.active');
      var link = links[links.length - 1];
      if (!link) return;
      var zoom = pageZoom();
      var rect = link.getBoundingClientRect();
      var offset = rect.top + rect.height / 2 - window.innerHeight / 2;
      panel.scrollTo({
        top: panel.scrollTop + offset / zoom,
        behavior: behavior,
      });
    }

    window.addEventListener("quarto-sectionChanged", function () {
      follow(reducedMotion.matches ? "auto" : "smooth");
    });
    window.addEventListener("load", function () {
      requestAnimationFrame(function () {
        follow("auto");
      });
    });
  })();
</script>
