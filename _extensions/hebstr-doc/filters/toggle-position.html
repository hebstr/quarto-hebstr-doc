<script>
  (function () {
    var home = null;

    function labelFormats(formats) {
      formats.querySelectorAll("a").forEach(function (link) {
        if (link.querySelector(".hebstr-format-label")) return;
        var label = link.textContent.trim();
        if (!label) return;
        link.setAttribute("aria-label", label);
        link.setAttribute("title", label);
        Array.prototype.slice.call(link.childNodes).forEach(function (node) {
          if (node.nodeType !== Node.TEXT_NODE || !node.textContent.trim()) {
            return;
          }
          var span = document.createElement("span");
          span.className = "hebstr-format-label";
          link.replaceChild(span, node);
          span.appendChild(node);
        });
      });
    }

    function moveFormats(target) {
      var formats = document.querySelector(".quarto-alternate-formats");
      if (!formats || !target || formats.parentNode === target) return;
      labelFormats(formats);
      target.appendChild(formats);
    }

    function place(toggle, parent, before) {
      var focused = document.activeElement === toggle;
      parent.insertBefore(toggle, before);
      if (focused) toggle.focus();
    }

    function moveToggle() {
      var toggle = document.querySelector(".quarto-color-scheme-toggle");
      if (!toggle) return false;
      if (!home) {
        home = {
          parent: toggle.parentNode,
          next: toggle.nextSibling,
          floating: toggle.classList.contains("top-right"),
          container: toggle.closest(".quarto-color-scheme-toggle-container"),
        };
      }
      if (!toggle.hasAttribute("aria-label")) {
        toggle.setAttribute("aria-label", "Toggle light and dark mode");
      }
      if (!home.floating) return true;
      var narrow = !window.matchMedia("(min-width: 768px)").matches;
      if (narrow || document.getElementById("quarto-sidebar")) {
        if (home.parent && toggle.parentNode !== home.parent) {
          if (home.container) home.container.hidden = false;
          toggle.classList.remove("hebstr-rail-toggle");
          toggle.classList.add("top-right");
          place(toggle, home.parent, home.next);
        }
        moveFormats(home.parent);
        return true;
      }
      var rail = document.querySelector(".hebstr-rail");
      if (!rail) {
        rail = document.createElement("div");
        rail.className = "hebstr-rail";
        rail.setAttribute("role", "region");
        rail.setAttribute("aria-label", toggle.getAttribute("aria-label"));
        document.body.appendChild(rail);
      }
      if (toggle.parentNode !== rail) {
        toggle.classList.remove("top-right");
        toggle.classList.add("hebstr-rail-toggle");
        place(toggle, rail, null);
        if (home.container) home.container.hidden = true;
      }
      moveFormats(rail);
      return true;
    }
    function tryMove(retries) {
      if (moveToggle()) return;
      if (retries <= 0) return;
      requestAnimationFrame(function () {
        tryMove(retries - 1);
      });
    }
    var pending = false;
    window.addEventListener("resize", function () {
      if (pending) return;
      pending = true;
      requestAnimationFrame(function () {
        pending = false;
        moveToggle();
      });
    });
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        tryMove(20);
      });
    } else {
      tryMove(20);
    }
  })();
</script>
