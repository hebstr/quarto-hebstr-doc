<script>
  (function () {
    var home = null;

    function moveToggle() {
      var toggle = document.querySelector(".quarto-color-scheme-toggle");
      if (!toggle) return false;
      if (!home) {
        home = {
          parent: toggle.parentNode,
          next: toggle.nextSibling,
          floating: toggle.classList.contains("top-right"),
        };
      }
      // Quarto builds the toggle with no text and no label, so the glyph would be
      // its only accessible name.
      if (!toggle.hasAttribute("aria-label")) {
        toggle.setAttribute("aria-label", "Toggle light and dark mode");
      }
      var sidebar = document.getElementById("quarto-margin-sidebar");
      // Below Quarto's breakpoint the sidebar is dropped from the layout, and a
      // toggle parked inside it would go with it.
      if (!sidebar || sidebar.getClientRects().length === 0) {
        if (home.parent && toggle.parentNode !== home.parent) {
          toggle.classList.remove("hebstr-sidebar-toggle");
          if (home.floating) toggle.classList.add("top-right");
          home.parent.insertBefore(toggle, home.next);
        }
        return true;
      }
      var row = sidebar.querySelector(".hebstr-toggle-row");
      if (!row) {
        row = document.createElement("div");
        row.className = "hebstr-toggle-row";
        sidebar.insertBefore(row, sidebar.firstChild);
      }
      if (toggle.parentNode !== row) {
        toggle.classList.remove("top-right");
        toggle.classList.add("hebstr-sidebar-toggle");
        row.appendChild(toggle);
      }
      return true;
    }
    function tryMove(retries) {
      if (moveToggle()) return;
      if (retries <= 0) return;
      requestAnimationFrame(function () {
        tryMove(retries - 1);
      });
    }
    var pending = false;
    window.addEventListener("resize", function () {
      if (pending) return;
      pending = true;
      requestAnimationFrame(function () {
        pending = false;
        moveToggle();
      });
    });
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        tryMove(20);
      });
    } else {
      tryMove(20);
    }
  })();
</script>
