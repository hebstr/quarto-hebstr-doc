name: Render

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The stylelint and prettier hooks resolve from node_modules/.bin, which the
      # repo does not commit, so the gate toolchain has to be restored first.
      - name: Install CSS gate toolchain
        run: npm ci

      - name: Pre-commit hooks (prek)
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          # prose-lint is a local system hook (personal dotfiles script), absent on the runner.
          extra-args: --all-files --skip prose-lint

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::dplyr
            any::gt
            any::reactable
            any::ggplot2
            any::svglite
            any::palmerpenguins
            any::sessioninfo
            any::officer
            any::xml2

      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - name: Lua unit tests
        run: quarto pandoc lua tests/run.lua

      - name: Lua type check (lua-language-server)
        run: |
          curl -sSL -o "$RUNNER_TEMP/luals.tar.gz" https://github.com/LuaLS/lua-language-server/releases/download/3.18.2/lua-language-server-3.18.2-linux-x64.tar.gz
          mkdir -p "$RUNNER_TEMP/luals" && tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          "$RUNNER_TEMP/luals/bin/lua-language-server" --check . --checklevel Warning

      # Renders its own probe: the bundled R syntax definition only prevails
      # through Quarto's last-wins ordering, which a Quarto upgrade could change
      # without failing the Lua suite or the render below.
      - name: R syntax token assertions
        run: bash tests/r-syntax-tokens.sh

      # Renders its own probe too: a float that stops reaching the custom
      # crossref type loses its number and caption without failing the render.
      - name: Annexe float assertions
        run: bash tests/anx-float.sh

      # The one assertion no render can make on its own: LibreOffice converts a
      # document Word refuses, so a cell left open by a raw OOXML table shows
      # nowhere else.
      - name: DOCX cell assertions
        run: bash tests/docx-cell.sh

      # The caption filter hangs on the shape and stage Quarto writes float
      # captions in, neither documented, and scripts/check-docx.R (officer)
      # reads what of template.dotx Pandoc carries into the output.
      - name: DOCX template assertions
        run: bash tests/docx-template.sh

      - name: Render example.qmd (HTML)
        run: quarto render example.qmd --to hebstr-doc-html

      - uses: actions/upload-artifact@v7
        with:
          name: example-html
          path: |
            example.html
            example_files/
          if-no-files-found: warn
